description: 'Delphia (Delphia Technologies Inc., Toronto, Canada) is an AI-driven
  quantitative investment firm that puts alternative data to work in systematic trading
  strategies. Originally a consumer robo-advisor and data-reward token platform backed
  by a $60M Series A led by Multicoin Capital, Delphia pivoted in 2024 to institutional
  quant investing with its Oracle Alpha hedge fund and Tilt trend platform. As of this
  writing Delphia publishes no public developer API, SDK, or developer portal; this
  profile captures the company identity plus its live security and well-known surfaces.'
